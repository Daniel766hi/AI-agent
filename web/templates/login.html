<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root { color-scheme: dark; --bg:#0d1117; --panel:#161b22; --line:#30363d;
          --text:#e6edf3; --dim:#8b949e; --accent:#2f81f7; --bad:#f85149; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg);
         color:var(--text); font:15px/1.5 ui-sans-serif,system-ui,-apple-system,sans-serif; padding:16px; }
  form { background:var(--panel); border:1px solid var(--line); border-radius:10px;
         padding:32px; width:100%; max-width:380px; }
  h1 { margin:0 0 6px; font-size:18px; }
  p { margin:0 0 20px; color:var(--dim); font-size:13px; }
  input { width:100%; padding:10px 12px; border-radius:6px; border:1px solid var(--line);
          background:var(--bg); color:var(--text); font-family:ui-monospace,monospace; font-size:13px; }
  input:focus { outline:2px solid var(--accent); outline-offset:-1px; border-color:transparent; }
  button { width:100%; margin-top:12px; padding:10px; border:0; border-radius:6px;
           background:var(--accent); color:#fff; font-weight:600; font-size:14px; cursor:pointer; }
  button:hover { background:#4493f8; }
  .error { color:var(--bad); font-size:13px; margin-top:12px; }
</style>
</head>
<body>
  <form method="post">
    <h1>Trading dashboard</h1>
    <p>Paste the access token printed when the server started.</p>
    <input type="password" name="token" placeholder="Access token" autofocus autocomplete="current-password">
    <button type="submit">Sign in</button>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
  </form>
</body>
</html>
