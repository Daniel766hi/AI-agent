<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500&family=Fira+Sans:wght@400;500;600&display=swap">
<style>
  :root {
    --bg:#020617; --surface:#0E1223; --surface-2:#161B2E; --border:#263149; --border-hi:#334155;
    --fg:#F8FAFC; --fg-muted:#94A3B8; --fg-dim:#6B7A90; --good:#22C55E; --bad:#EF4444; --info:#38BDF8;
    --sans:"Fira Sans",ui-sans-serif,system-ui,sans-serif; --mono:"Fira Code",ui-monospace,monospace;
    --ease:cubic-bezier(.4,0,.2,1);
  }
  * { box-sizing:border-box; }
  body {
    margin:0; min-height:100vh; display:grid; place-items:center;
    background:var(--bg); color:var(--fg); font-family:var(--sans); font-size:15px;
    padding:24px; -webkit-font-smoothing:antialiased;
  }
  :focus-visible { outline:2px solid var(--info); outline-offset:2px; border-radius:4px; }
  form { width:100%; max-width:360px; display:flex; flex-direction:column; gap:16px; }
  .brand { display:flex; align-items:center; gap:8px; font-weight:600; font-size:16px; }
  .brand svg { width:19px; height:19px; color:var(--good); }
  p { margin:0; color:var(--fg-muted); font-size:13.5px; line-height:1.5; }
  label { font-size:11px; font-weight:500; letter-spacing:.07em; text-transform:uppercase; color:var(--fg-dim); }
  .field { display:flex; flex-direction:column; gap:6px; }
  input {
    min-height:46px; padding:0 14px; background:var(--surface); color:var(--fg);
    border:1px solid var(--border); border-radius:8px;
    font-family:var(--mono); font-size:13.5px; width:100%;
    transition:border-color .18s var(--ease), background .18s var(--ease);
  }
  input:hover { border-color:var(--border-hi); }
  input:focus { background:var(--surface-2); }
  button {
    min-height:46px; border:1px solid var(--good); border-radius:8px;
    background:var(--good); color:#04120A; font-family:var(--sans); font-weight:600; font-size:14.5px;
    cursor:pointer; transition:background .18s var(--ease), border-color .18s var(--ease);
  }
  button:hover { background:#2BD46A; border-color:#2BD46A; }
  .error {
    display:flex; gap:10px; align-items:flex-start;
    background:rgba(239,68,68,.12); border:1px solid rgba(239,68,68,.35);
    color:var(--bad); border-radius:8px; padding:11px 13px; font-size:13px; line-height:1.45;
  }
  .error svg { width:15px; height:15px; flex:none; margin-top:2px; }
  @media (prefers-reduced-motion: reduce) { * { transition:none !important; } }
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <symbol id="i-pulse" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 12h-4l-3 9L9 3l-3 9H2"/></symbol>
  <symbol id="i-alert" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 9v4"/><path d="M12 17h.01"/><circle cx="12" cy="12" r="9"/></symbol>
</defs></svg>

<form method="post">
  <div class="brand"><svg aria-hidden="true"><use href="#i-pulse"/></svg>Trading Console</div>
  <p>Paste the access token printed when the server started.</p>
  <div class="field">
    <label for="token">Access token</label>
    <input type="password" name="token" id="token" autofocus autocomplete="current-password" placeholder="••••••••••••••••">
  </div>
  <button type="submit">Sign in</button>
  {% if error %}<div class="error"><svg aria-hidden="true"><use href="#i-alert"/></svg><div>{{ error }}</div></div>{% endif %}
</form>
